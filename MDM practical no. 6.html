<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 flex items-center justify-center p-6">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden">

        <div class="grid md:grid-cols-2">

            <!-- LEFT SIDE -->
            <div class="p-8 md:p-10 bg-white">

                <div class="mb-8">
                    <p class="text-indigo-600 font-semibold text-sm uppercase tracking-wider">
                        Student Portal
                    </p>

                    <h1 class="text-3xl font-bold text-gray-800 mt-2">
                        Grade Calculator
                    </h1>

                    <p class="text-gray-500 mt-2">
                        Enter marks for all subjects
                    </p>
                </div>

                <div class="space-y-4">

                    <div>
                        <label class="font-semibold text-gray-700">
                            📘 Mathematics
                        </label>
                        <input id="m1" type="number" min="0" max="100"
                            placeholder="Enter marks out of 100"
                            class="mt-2 w-full p-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="font-semibold text-gray-700">
                            💻 Computer Science
                        </label>
                        <input id="m2" type="number" min="0" max="100"
                            placeholder="Enter marks out of 100"
                            class="mt-2 w-full p-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="font-semibold text-gray-700">
                            🔬 Physics
                        </label>
                        <input id="m3" type="number" min="0" max="100"
                            placeholder="Enter marks out of 100"
                            class="mt-2 w-full p-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="font-semibold text-gray-700">
                            🧪 Chemistry
                        </label>
                        <input id="m4" type="number" min="0" max="100"
                            placeholder="Enter marks out of 100"
                            class="mt-2 w-full p-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="font-semibold text-gray-700">
                            📖 English
                        </label>
                        <input id="m5" type="number" min="0" max="100"
                            placeholder="Enter marks out of 100"
                            class="mt-2 w-full p-3 rounded-xl border border-gray-200 bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <button onclick="calculateResult()"
                        class="w-full mt-3 py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-lg hover:bg-indigo-700 transition">
                        Calculate Result →
                    </button>

                </div>
            </div>


            <!-- RIGHT SIDE -->
            <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-8 md:p-10 text-white">

                <div class="mb-8">
                    <p class="text-indigo-200 font-medium">
                        RESULT SUMMARY
                    </p>

                    <h2 class="text-3xl font-bold mt-2">
                        Your Performance
                    </h2>
                </div>

                <!-- Grade -->
                <div class="bg-white/15 backdrop-blur rounded-2xl p-6 text-center mb-5">

                    <p class="text-indigo-200">
                        Overall Grade
                    </p>

                    <div id="grade"
                        class="text-7xl font-black mt-2">
                        —
                    </div>

                    <p id="message" class="text-indigo-100 mt-2">
                        Enter marks to see your grade
                    </p>

                </div>


                <!-- Stats -->
                <div class="grid grid-cols-2 gap-4">

                    <div class="bg-white rounded-2xl p-5 text-center text-gray-800">
                        <p class="text-gray-500 text-sm">
                            Total Marks
                        </p>

                        <p id="total"
                            class="text-3xl font-bold text-indigo-600 mt-2">
                            0
                        </p>

                        <p class="text-gray-400 text-sm">
                            / 500
                        </p>
                    </div>


                    <div class="bg-white rounded-2xl p-5 text-center text-gray-800">
                        <p class="text-gray-500 text-sm">
                            Percentage
                        </p>

                        <p id="percentage"
                            class="text-3xl font-bold text-purple-600 mt-2">
                            0%
                        </p>
                    </div>

                </div>


                <!-- Progress -->
                <div class="mt-6 bg-white/10 rounded-2xl p-5">

                    <div class="flex justify-between mb-2">
                        <span class="text-indigo-100">
                            Performance
                        </span>

                        <span id="percentText">
                            0%
                        </span>
                    </div>

                    <div class="w-full bg-white/20 rounded-full h-3">

                        <div id="progress"
                            class="bg-white h-3 rounded-full transition-all duration-700"
                            style="width: 0%">
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>


    <script>

        function calculateResult() {

            let marks = [
                Number(document.getElementById("m1").value),
                Number(document.getElementById("m2").value),
                Number(document.getElementById("m3").value),
                Number(document.getElementById("m4").value),
                Number(document.getElementById("m5").value)
            ];

            if (marks.some(mark => mark < 0 || mark > 100)) {
                alert("Please enter marks between 0 and 100.");
                return;
            }

            let total = marks.reduce((sum, mark) => sum + mark, 0);

            let percentage = total / 5;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } 
            else if (percentage >= 80) {
                grade = "A";
            } 
            else if (percentage >= 70) {
                grade = "B";
            } 
            else if (percentage >= 60) {
                grade = "C";
            } 
            else if (percentage >= 50) {
                grade = "D";
            } 
            else {
                grade = "F";
            }


            document.getElementById("total").innerText = total;

            document.getElementById("percentage").innerText =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").innerText = grade;

            document.getElementById("percentText").innerText =
                percentage.toFixed(0) + "%";

            document.getElementById("progress").style.width =
                percentage + "%";


            if (grade === "F") {
                document.getElementById("message").innerText =
                    "Keep practicing and improve!";
            } 
            else if (grade === "A+" || grade === "A") {
                document.getElementById("message").innerText =
                    "Excellent Performance! 🎉";
            } 
            else {
                document.getElementById("message").innerText =
                    "Good job! Keep improving 👍";
            }
        }

    </script>

</body>
</html>
